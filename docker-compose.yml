# Pi coding agent — sandbox (standalone)
#
# Interactive / one-shot:
#   docker compose run --rm -it pi-sandbox bash
#   docker compose run --rm pi-sandbox -p "your task"
#   docker compose run --rm pi-sandbox -p "task" --model vllm/some-model
#
# Persistent MCP bridge (for Hermes delegation):
#   docker compose up -d pi-sandbox-mcp
#   Requires PI_MCP_API_KEY set (in .env) — the bridge refuses to start open.
#
# All PI_LLM_* env vars can be overridden here or in .env.
# PI_UID / PI_GID are BUILD ARGS (set the in-container user); rebuild when changed.

services:
  pi-sandbox:
    image: pi-sandbox:${PI_TAG:-latest}
    container_name: pi-sandbox
    build:
      context: .
      args:
        PI_UID: ${PI_UID:-1000}
        PI_GID: ${PI_GID:-100}
        PI_USER_NAME: ${PI_USER_NAME:-pi}
        NODE_MAJOR_VERSION: ${NODE_MAJOR_VERSION:-26}
        PI_NPM_VERSION: ${PI_NPM_VERSION:-1.5.0}
    restart: unless_started
    environment:
      PI_CODING_AGENT_DIR: /home/pi/.pi/agent
      WORKSPACE_DIR: /home/pi/workspace
      PI_LLM_PROVIDER_NAME: ${PI_LLM_PROVIDER_NAME:-vllm}
      PI_LLM_BASE_URL: ${PI_LLM_BASE_URL:-http://your-llm-host:8000/v1}
      PI_LLM_API: ${PI_LLM_API:-openai-completions}
      PI_LLM_API_KEY: ${PI_LLM_API_KEY}
      PI_LLM_MODEL_ID: ${PI_LLM_MODEL_ID:-your-org/your-model}
      PI_LLM_MODEL_NAME: ${PI_LLM_MODEL_NAME:-your-org/your-model (example)}
      PI_LLM_REASONING: ${PI_LLM_REASONING:-true}
      PI_LLM_INPUT: ${PI_LLM_INPUT:-text}
      PI_LLM_CONTEXT_WINDOW: ${PI_LLM_CONTEXT_WINDOW:-262144}
      PI_LLM_MAX_TOKENS: ${PI_LLM_MAX_TOKENS:-32768}
      PI_OFFLINE: 1
      PI_SKIP_VERSION_CHECK: 1
      PI_TELEMETRY: 0
      # Hindsight long-term memory (official CLI; shared bank with Hermes —
      # same key as the hindsight server's HINDSIGHT_TENANT_API_KEY).
      # HINDSIGHT_BANK_ID: one shared bank, named here (default "agents").
      HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-http://your-hindsight-host:8888}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-agents}
    volumes:
      - ${HOST_WORKSPACE:-/path/to/your/workspace}:/home/pi/workspace
      - pi-agent-home:/home/pi/.pi/agent
      - ./memory:/home/pi/memory
      - ${OBSIDIAN_VAULT_HOST_DIR:-/path/to/obsidian}:/home/pi/obsidian
    working_dir: /home/pi/workspace
    entrypoint: ["/opt/pi/entrypoint.sh"]
    command: ["--version"]

  # Persistent MCP bridge daemon (Hermes delegation). Long-running.
  pi-sandbox-mcp:
    image: pi-sandbox:${PI_TAG:-latest}
    container_name: pi-sandbox-mcp
    restart: unless_started
    environment:
      PI_CODING_AGENT_DIR: /home/pi/.pi/agent
      WORKSPACE_DIR: /home/pi/workspace
      PI_LLM_PROVIDER_NAME: ${PI_LLM_PROVIDER_NAME:-vllm}
      PI_LLM_BASE_URL: ${PI_LLM_BASE_URL:-http://your-llm-host:8000/v1}
      PI_LLM_API: ${PI_LLM_API:-openai-completions}
      PI_LLM_API_KEY: ${PI_LLM_API_KEY}
      PI_LLM_MODEL_ID: ${PI_LLM_MODEL_ID:-your-org/your-model}
      PI_LLM_MODEL_NAME: ${PI_LLM_MODEL_NAME:-your-org/your-model (example)}
      PI_LLM_REASONING: ${PI_LLM_REASONING:-true}
      PI_LLM_INPUT: ${PI_LLM_INPUT:-text}
      PI_LLM_CONTEXT_WINDOW: ${PI_LLM_CONTEXT_WINDOW:-262144}
      PI_LLM_MAX_TOKENS: ${PI_LLM_MAX_TOKENS:-32768}
      PI_OFFLINE: 1
      PI_SKIP_VERSION_CHECK: 1
      PI_TELEMETRY: 0
      PI_MCP_API_KEY: ${PI_MCP_API_KEY}
      PI_MCP_PORT: ${PI_MCP_PORT:-3103}
      PI_TIMEOUT_SECONDS: ${PI_TIMEOUT_SECONDS:-3600}
      # Hindsight long-term memory (official CLI; shared bank with Hermes —
      # same key as the hindsight server's HINDSIGHT_TENANT_API_KEY).
      HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-http://your-hindsight-host:8888}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_BANK_ID: ${HINDSIGHT_BANK_ID:-agents}
    volumes:
      - ${HOST_WORKSPACE:-/path/to/your/workspace}:/home/pi/workspace
      - pi-agent-home:/home/pi/.pi/agent
      - ./memory:/home/pi/memory
      - ${OBSIDIAN_VAULT_HOST_DIR:-/path/to/obsidian}:/home/pi/obsidian
    working_dir: /home/pi/workspace
    entrypoint: ["/opt/pi/entrypoint.sh"]
    command: ["mcp"]
    # Reached via Docker DNS on the traefik network (http://pi-sandbox-mcp:3103).
    # Uncomment to also expose on the LAN (not required for Hermes):
    # ports:
    #   - "${PI_MCP_PORT:-3103}:${PI_MCP_PORT:-3103}"

  # Persistent ACP server daemon (acp mode — WebSocket + bearer auth).
  # Long-running; reached via Docker DNS on the traefik network
  # (ws://pi-sandbox-acp:3123). NO host port is published.
  #
  # LAN routing: the project's default network IS the external traefik
  # network, so the host's Traefik can DNS-resolve this container directly.
  # The router labels below expose it on $PI_ACP_DOMAIN (LAN-only — Traefik
  # sits on the LAN; nothing is Internet-exposed). ws:// on the plain
  # entrypoint, wss:// when Traefik terminates TLS.
  pi-sandbox-acp:
    image: pi-sandbox:${PI_TAG:-latest}
    container_name: pi-sandbox-acp
    restart: unless_started
    environment:
      PI_CODING_AGENT_DIR: /home/pi/.pi/agent
      WORKSPACE_DIR: /home/pi/workspace
      PI_LLM_PROVIDER_NAME: ${PI_LLM_PROVIDER_NAME:-vllm}
      PI_LLM_BASE_URL: ${PI_LLM_BASE_URL:-http://your-llm-host:8000/v1}
      PI_LLM_API: ${PI_LLM_API:-openai-completions}
      PI_LLM_API_KEY: ${PI_LLM_API_KEY}
      PI_LLM_MODEL_ID: ${PI_LLM_MODEL_ID:-your-org/your-model}
      PI_LLM_MODEL_NAME: ${PI_LLM_MODEL_NAME:-your-org/your-model (example)}
      PI_LLM_REASONING: ${PI_LLM_REASONING:-true}
      PI_LLM_INPUT: ${PI_LLM_INPUT:-text}
      PI_LLM_CONTEXT_WINDOW: ${PI_LLM_CONTEXT_WINDOW:-262144}
      PI_LLM_MAX_TOKENS: ${PI_LLM_MAX_TOKENS:-32768}
      PI_OFFLINE: 1
      PI_SKIP_VERSION_CHECK: 1
      PI_TELEMETRY: 0
      PI_ACP_API_KEY: ${PI_ACP_API_KEY}
      PI_ACP_PORT: ${PI_ACP_PORT:-3123}
    volumes:
      - ${HOST_WORKSPACE:-/path/to/your/workspace}:/home/pi/workspace
      - pi-agent-home:/home/pi/.pi/agent
      - ./memory:/home/pi/memory
    working_dir: /home/pi/workspace
    entrypoint: ["/opt/pi/entrypoint.sh"]
    command: ["acp"]
    expose:
      - "${PI_ACP_PORT:-3123}"
    # Traefik router (LAN-only). The project's default network is the
    # external traefik network, so no port publish is needed.
    # The WS server serves every path, so a Host() rule suffices.
    # Defaults match the Unraid host's Traefik (conf/):
    #   entry point "https" (:443); "http" (:80) auto-redirects to it
    #   certresolver "production" = Let's Encrypt via Cloudflare DNS
    #   challenge — PI_ACP_DOMAIN needs a Cloudflare DNS record, the
    #   cert is auto-issued, no ports opened
    #   middleware "secured" = RFC1918 IP whitelist + security headers,
    #   so the endpoint answers only to LAN clients despite the public
    #   domain
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pi-acp.rule=Host(${PI_ACP_DOMAIN:-pi.example.lan})"
      - "traefik.http.routers.pi-acp.entrypoints=${PI_ACP_ENTRYPOINTS:-https}"
      - "traefik.http.routers.pi-acp.tls.certresolver=${PI_ACP_CERTRESOLVER:-production}"
      - "traefik.http.routers.pi-acp.middlewares=${PI_ACP_MIDDLEWARES:-secured@file}"
      - "traefik.http.services.pi-acp.loadbalancer.server.port=${PI_ACP_PORT:-3123}"

volumes:
  pi-agent-home:

networks:
  default:
    name: traefik
    external: true
